$kind: http-request
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{emailMixedCase}}",
      "username": "Doublon",
      "password": "{{password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 409", () => pm.response.to.have.status(409));
      pm.test("Code EMAIL_ALREADY_USED", () => pm.expect(pm.response.json().code).to.eql("EMAIL_ALREADY_USED"));

      pm.test("Réponse au format d'erreur du contrat", () => {
          const body = pm.response.json();
          pm.expect(body).to.have.property("code").that.is.a("string");
          pm.expect(body).to.have.property("message").that.is.a("string");
      });
    language: text/javascript
order: 2000
