$kind: collection
description: |-
  Tests de l'API de GDT : authentification (dossiers 0 à 3) et espaces (dossiers 4 à 8).

  À exécuter dans l'ordre avec le Collection Runner : chaque requête peut dépendre des variables créées par les précédentes (email, token, identifiants d'espaces).

  Prérequis : serveur lancé sur {{baseUrl}} et base de données démarrée.
variables:
  - key: baseUrl
    value: http://localhost:8080
    disabled: false
  - key: email
    value: ""
    disabled: false
  - key: emailMixedCase
    value: ""
    disabled: false
  - key: password
    value: ""
    disabled: false
  - key: token
    value: ""
    disabled: false
