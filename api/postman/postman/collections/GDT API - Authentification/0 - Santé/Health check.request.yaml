$kind: http-request
url: "{{baseUrl}}/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 200", () => pm.response.to.have.status(200));
      pm.test("Corps {status: ok}", () => pm.expect(pm.response.json().status).to.eql("ok"));
    language: text/javascript
order: 1000
