$kind: http-request
url: "{{baseUrl}}/spaces/{{otherNoteSpaceId}}/notes"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 200", () => pm.response.to.have.status(200));
      pm.test("Le second espace ne contient aucune note", () =>
          pm.expect(pm.response.json()).to.be.an("array").that.is.empty);
    language: text/javascript
order: 6000
