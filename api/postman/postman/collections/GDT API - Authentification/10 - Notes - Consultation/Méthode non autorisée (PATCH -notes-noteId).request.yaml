$kind: http-request
name: "Méthode non autorisée (PATCH /notes/{noteId})"
url: "{{baseUrl}}/notes/{{noteId}}"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "status": "done"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 405", () => pm.response.to.have.status(405));
    language: text/javascript
order: 14000
