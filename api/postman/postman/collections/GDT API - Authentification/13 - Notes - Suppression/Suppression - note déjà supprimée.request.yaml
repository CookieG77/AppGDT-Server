$kind: http-request
url: "{{baseUrl}}/notes/{{noteId}}"
method: DELETE
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 404", () => pm.response.to.have.status(404));
      pm.test("Code NOT_FOUND", () => pm.expect(pm.response.json().code).to.eql("NOT_FOUND"));

      pm.test("Réponse au format d'erreur du contrat", () => {
          const body = pm.response.json();
          pm.expect(body).to.have.property("code").that.is.a("string");
          pm.expect(body).to.have.property("message").that.is.a("string");
      });
    language: text/javascript
order: 7000
