$kind: http-request
url: "{{baseUrl}}/notes/{{secondNoteId}}"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: beforeRequest
    code: |-
      // Vérifie aussi les autres notes de l'espace supprimé
      const baseUrl = pm.collectionVariables.get("baseUrl");
      ["thirdNoteId", "boundaryNoteId", "specialNoteId"].forEach(v => {
          pm.sendRequest({
              url: `${baseUrl}/notes/${pm.collectionVariables.get(v)}`,
              method: "GET",
              header: { Authorization: `Bearer ${pm.collectionVariables.get("token")}` },
          }, (error, res) => {
              pm.test(`${v} supprimée avec l'espace (404)`, () => {
                  pm.expect(error).to.be.null;
                  pm.expect(res.code).to.eql(404);
              });
          });
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Statut 404", () => pm.response.to.have.status(404));
      pm.test("Code NOT_FOUND", () => pm.expect(pm.response.json().code).to.eql("NOT_FOUND"));

      pm.test("Réponse au format d'erreur du contrat", () => {
          const body = pm.response.json();
          pm.expect(body).to.have.property("code").that.is.a("string");
          pm.expect(body).to.have.property("message").that.is.a("string");
      });
    language: text/javascript
order: 9000
