$kind: http-request
url: "{{baseUrl}}/notes/{{noteId}}"
method: DELETE
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 204", () => pm.response.to.have.status(204));
      pm.test("Corps de réponse vide", () => pm.expect(pm.response.text()).to.be.empty);
    language: text/javascript
order: 4000
