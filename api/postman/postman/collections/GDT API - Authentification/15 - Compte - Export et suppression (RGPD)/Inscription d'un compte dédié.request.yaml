$kind: http-request
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{rgpdEmail}}",
      "username": "Compte RGPD",
      "password": "{{password}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      pm.collectionVariables.set("rgpdEmail", `rgpd_${Date.now()}@example.com`);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Statut 201", () => pm.response.to.have.status(201));
      pm.collectionVariables.set("rgpdUserId", pm.response.json().id);
    language: text/javascript
order: 1000
