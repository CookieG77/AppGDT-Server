$kind: http-request
url: "{{baseUrl}}/users/me"
method: GET
headers:
  Authorization: Bearer {{rgpdToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 200", () => pm.response.to.have.status(200));
      pm.test("Compte intact", () => pm.expect(pm.response.json().email).to.eql(pm.collectionVariables.get("rgpdEmail")));
    language: text/javascript
order: 11000
