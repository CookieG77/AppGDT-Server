$kind: http-request
url: "{{baseUrl}}/spaces/{{rgpdSpaceId}}/notes"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{rgpdToken}}
body:
  type: json
  content: |-
    {
      "title": "Note à exporter",
      "content": "Contenu personnel",
      "status": "in_progress"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 201", () => pm.response.to.have.status(201));
      pm.collectionVariables.set("rgpdNoteId", pm.response.json().id);
    language: text/javascript
order: 4000
