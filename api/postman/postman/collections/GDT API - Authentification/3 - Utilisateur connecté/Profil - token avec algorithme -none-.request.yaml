$kind: http-request
name: Profil - token avec algorithme "none"
url: "{{baseUrl}}/users/me"
method: GET
headers:
  Authorization: Bearer {{noneToken}}
scripts:
  - type: beforeRequest
    code: |-
      // Token non signé déclarant l'algorithme "none" (attaque par confusion d'algorithme)
      const b64url = s => btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
      const header = b64url(JSON.stringify({ alg: "none", typ: "JWT" }));
      const payload = b64url(JSON.stringify({ sub: "1", exp: Math.floor(Date.now() / 1000) + 3600 }));
      pm.collectionVariables.set("noneToken", `${header}.${payload}.`);
    language: text/javascript
  - type: afterResponse
    code: "pm.test(\"Statut 401 : l'algorithme none est refusé\", () => pm.response.to.have.status(401));"
    language: text/javascript
order: 5000
