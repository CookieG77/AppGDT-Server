$kind: http-request
url: "{{baseUrl}}/users/me"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 200", () => pm.response.to.have.status(200));
      pm.test("C'est bien l'utilisateur connecté", () =>
          pm.expect(pm.response.json().email).to.eql(pm.collectionVariables.get("email")));

      pm.test("Aucun mot de passe ni hash exposé", () => {
          const body = pm.response.json();
          ["password", "passwordHash", "password_hash", "PasswordHash"].forEach(k =>
              pm.expect(body).to.not.have.property(k));
      });
    language: text/javascript
order: 1000
