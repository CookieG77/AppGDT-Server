$kind: http-request
url: "{{baseUrl}}/spaces/{{spaceId}}"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "name": "",
      "description": "{{tooLongDescription}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      pm.collectionVariables.set("tooLongDescription", "a".repeat(1001));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Statut 400", () => pm.response.to.have.status(400));
      pm.test("Code VALIDATION_ERROR", () => pm.expect(pm.response.json().code).to.eql("VALIDATION_ERROR"));
      pm.test("Champ(s) signalé(s) : name, description", () => {
          const fields = pm.response.json().details.map(d => d.field);
          pm.expect(fields).to.have.members(["name", "description"]);
      });

      pm.test("Réponse au format d'erreur du contrat", () => {
          const body = pm.response.json();
          pm.expect(body).to.have.property("code").that.is.a("string");
          pm.expect(body).to.have.property("message").that.is.a("string");
      });
    language: text/javascript
order: 5000
