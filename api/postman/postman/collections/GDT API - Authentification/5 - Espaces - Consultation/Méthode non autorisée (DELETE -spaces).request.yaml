$kind: http-request
name: "Méthode non autorisée (DELETE /spaces)"
url: "{{baseUrl}}/spaces"
method: DELETE
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 405", () => pm.response.to.have.status(405));
    language: text/javascript
order: 14000
