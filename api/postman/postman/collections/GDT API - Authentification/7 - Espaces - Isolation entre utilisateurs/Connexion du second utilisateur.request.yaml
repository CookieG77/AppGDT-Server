$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email2}}",
      "password": "{{password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("Token présent", () => pm.expect(body.token).to.be.a("string").and.not.empty);
      pm.collectionVariables.set("token2", body.token);
    language: text/javascript
order: 2000
