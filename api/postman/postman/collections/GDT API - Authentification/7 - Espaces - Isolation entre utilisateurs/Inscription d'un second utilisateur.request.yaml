$kind: http-request
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email2}}",
      "username": "Second utilisateur",
      "password": "{{password}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      pm.collectionVariables.set("email2", `second.user_${Date.now()}@example.com`);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Statut 201", () => pm.response.to.have.status(201));
    language: text/javascript
order: 1000
