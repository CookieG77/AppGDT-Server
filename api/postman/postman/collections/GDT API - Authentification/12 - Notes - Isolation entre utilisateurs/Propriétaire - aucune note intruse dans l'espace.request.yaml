$kind: http-request
url: "{{baseUrl}}/spaces/{{noteSpaceId}}/notes"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 200", () => pm.response.to.have.status(200));
      pm.test("L'espace contient toujours exactement 5 notes", () => pm.expect(pm.response.json()).to.have.lengthOf(5));
    language: text/javascript
order: 7000
