openapi: 3.1.0

info:
  title: GDT API
  version: 0.1.0
  description: |
    API REST de gestion de notes organisées par espaces.

    Un utilisateur authentifié possède des espaces, et chaque espace contient des notes.
    Un utilisateur ne peut accéder qu'à ses propres espaces et notes : toute ressource
    appartenant à un autre utilisateur est traitée comme inexistante (réponse 404).

    Chaque réponse contient un en-tête `X-Request-ID` identifiant la requête dans les logs
    du serveur. Un client peut envoyer son propre identifiant dans ce même en-tête
    (64 caractères max : lettres, chiffres, `.`, `_` et `-`) ; il est alors réutilisé.

    Toutes les erreurs suivent le schéma `Error`, y compris une route inexistante
    (404 `ROUTE_NOT_FOUND`) et une méthode non autorisée (405 `METHOD_NOT_ALLOWED`,
    avec l'en-tête `Allow` listant les méthodes acceptées).

servers:
  - url: http://localhost:8080
    description: Environnement local

tags:
  - name: Health
    description: État du service
  - name: Auth
    description: Inscription et connexion
  - name: Users
    description: Utilisateur connecté
  - name: Spaces
    description: Gestion des espaces
  - name: Notes
    description: Gestion des notes d'un espace

# Toutes les routes sont protégées par défaut.
# Les routes publiques le déclarent explicitement avec `security: []`.
security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------------------
  # Health
  # ---------------------------------------------------------------------------
  /health:
    get:
      tags: [Health]
      summary: Vérifier que l'API peut traiter des requêtes
      description: |
        Vérifie que le serveur répond et que la base de données est joignable
        (délai maximal de 2 secondes). Destinée aux outils de supervision.
      operationId: healthCheck
      security: []
      responses:
        "200":
          description: Le serveur et la base de données répondent
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
        "503":
          description: La base de données est injoignable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: SERVICE_UNAVAILABLE
                message: Le service est temporairement indisponible.

  # ---------------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------------
  /auth/register:
    post:
      tags: [Auth]
      summary: Créer un compte
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Compte créé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/login:
    post:
      tags: [Auth]
      summary: Se connecter et obtenir un token JWT
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Connexion réussie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Identifiants invalides (message volontairement générique)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: INVALID_CREDENTIALS
                message: Email ou mot de passe incorrect.
        "429":
          description: |
            Trop de connexions échouées récemment pour cet email ou pour l'IP du client.
            La connexion est refusée, même avec le bon mot de passe, jusqu'à la fin du blocage.
          headers:
            Retry-After:
              description: Nombre de secondes à attendre avant de réessayer
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: TOO_MANY_ATTEMPTS
                message: Trop de tentatives échouées. Veuillez réessayer plus tard.
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # Users
  # ---------------------------------------------------------------------------
  /users/me:
    get:
      tags: [Users]
      summary: Récupérer le profil de l'utilisateur connecté
      operationId: getCurrentUser
      responses:
        "200":
          description: Profil de l'utilisateur
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [Users]
      summary: Supprimer son compte (droit à l'effacement)
      description: |
        Supprime définitivement le compte de l'utilisateur connecté, ainsi que tous ses
        espaces et toutes ses notes. Le mot de passe est exigé, pour qu'un token volé ne
        suffise pas à effacer un compte. Les essais de mot de passe comptent dans la même
        limite que les connexions échouées. Après la suppression, le token n'est plus accepté.
      operationId: deleteCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountInput"
      responses:
        "204":
          description: Compte et données supprimés
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Mot de passe incorrect (la session reste valide)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: INVALID_PASSWORD
                message: Mot de passe incorrect.
        "429":
          description: Trop d'essais de mot de passe échoués récemment pour ce compte
          headers:
            Retry-After:
              description: Nombre de secondes à attendre avant de réessayer
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: TOO_MANY_ATTEMPTS
                message: Trop de tentatives échouées. Veuillez réessayer plus tard.
        "500":
          $ref: "#/components/responses/InternalError"

  /users/me/export:
    get:
      tags: [Users]
      summary: Exporter ses données (droit à la portabilité)
      description: |
        Renvoie toutes les données de l'utilisateur connecté : son profil, ses espaces et
        les notes de chaque espace. La réponse est proposée en téléchargement
        (en-tête `Content-Disposition: attachment`). Le mot de passe n'est jamais exporté.
      operationId: exportCurrentUser
      responses:
        "200":
          description: Données du compte
          headers:
            Content-Disposition:
              description: Nom du fichier proposé, par exemple `attachment; filename="gdt-export-2026-09-28.json"`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountExport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # Spaces
  # ---------------------------------------------------------------------------
  /spaces:
    get:
      tags: [Spaces]
      summary: Lister les espaces de l'utilisateur connecté
      operationId: listSpaces
      responses:
        "200":
          description: Liste des espaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Space"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [Spaces]
      summary: Créer un espace
      operationId: createSpace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceInput"
      responses:
        "201":
          description: Espace créé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Space"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /spaces/{spaceId}:
    parameters:
      - $ref: "#/components/parameters/SpaceId"

    get:
      tags: [Spaces]
      summary: Consulter un espace
      operationId: getSpace
      responses:
        "200":
          description: Détail de l'espace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Space"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      tags: [Spaces]
      summary: Modifier un espace
      description: Remplace le nom et la description de l'espace.
      operationId: updateSpace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceInput"
      responses:
        "200":
          description: Espace modifié
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Space"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [Spaces]
      summary: Supprimer un espace
      description: Supprime l'espace ainsi que toutes les notes qu'il contient.
      operationId: deleteSpace
      responses:
        "204":
          description: Espace supprimé
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # Notes
  # ---------------------------------------------------------------------------
  /spaces/{spaceId}/notes:
    parameters:
      - $ref: "#/components/parameters/SpaceId"

    get:
      tags: [Notes]
      summary: Lister les notes d'un espace
      operationId: listNotes
      responses:
        "200":
          description: Liste des notes de l'espace
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Note"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [Notes]
      summary: Créer une note dans un espace
      description: La note est automatiquement associée à l'espace indiqué dans le chemin.
      operationId: createNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteInput"
      responses:
        "201":
          description: Note créée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /notes/{noteId}:
    parameters:
      - $ref: "#/components/parameters/NoteId"

    get:
      tags: [Notes]
      summary: Consulter une note
      operationId: getNote
      responses:
        "200":
          description: Détail de la note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      tags: [Notes]
      summary: Modifier une note
      description: Remplace le titre, le contenu et l'état de la note.
      operationId: updateNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteInput"
      responses:
        "200":
          description: Note modifiée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [Notes]
      summary: Supprimer une note
      operationId: deleteNote
      responses:
        "204":
          description: Note supprimée
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    SpaceId:
      name: spaceId
      in: path
      required: true
      description: Identifiant de l'espace
      schema:
        type: integer
        format: int64
        minimum: 1

    NoteId:
      name: noteId
      in: path
      required: true
      description: Identifiant de la note
      schema:
        type: integer
        format: int64
        minimum: 1

  schemas:
    # --- Auth / Users --------------------------------------------------------
    RegisterInput:
      type: object
      required: [email, username, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: jean.dupont@example.com
        username:
          type: string
          minLength: 1
          maxLength: 50
          example: jdupont
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: MotDePasseSolide123

    LoginInput:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          example: jean.dupont@example.com
        password:
          type: string
          format: password
          example: MotDePasseSolide123

    DeleteAccountInput:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password:
          type: string
          format: password
          description: Mot de passe actuel, pour confirmer la suppression
          example: MotDePasseSolide123

    AccountExport:
      type: object
      required: [exportedAt, user, spaces]
      properties:
        exportedAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"
        spaces:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/Space"
              - type: object
                required: [notes]
                properties:
                  notes:
                    type: array
                    items:
                      $ref: "#/components/schemas/Note"

    AuthToken:
      type: object
      required: [token, tokenType, expiresIn]
      properties:
        token:
          type: string
          description: Token JWT à transmettre dans l'en-tête `Authorization`
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        tokenType:
          type: string
          const: Bearer
          example: Bearer
        expiresIn:
          type: integer
          description: Durée de validité du token, en secondes
          example: 3600

    User:
      type: object
      required: [id, email, username, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          format: email
          example: jean.dupont@example.com
        username:
          type: string
          example: jdupont
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # --- Spaces --------------------------------------------------------------
    Space:
      type: object
      required: [id, name, description, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Devoirs
        description:
          type: string
          example: Notes concernant mon travail scolaire
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SpaceInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Devoirs
        description:
          type: string
          default: ""
          example: Notes concernant mon travail scolaire

    # --- Notes ---------------------------------------------------------------
    NoteStatus:
      type: string
      enum: [todo, in_progress, done]
      description: |
        État de la note :
        - `todo` : non fait
        - `in_progress` : en cours
        - `done` : terminé

    Note:
      type: object
      required: [id, spaceId, title, content, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
          example: 12
        spaceId:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: Exercices de mathématiques
        content:
          type: string
          example: Faire les exercices 4 à 7 page 52.
        status:
          $ref: "#/components/schemas/NoteStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    NoteInput:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: Exercices de mathématiques
        content:
          type: string
          maxLength: 50000
          default: ""
          example: Faire les exercices 4 à 7 page 52.
        status:
          allOf:
            - $ref: "#/components/schemas/NoteStatus"
          default: todo

    # --- Errors --------------------------------------------------------------
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Code d'erreur stable, exploitable par le client
          example: VALIDATION_ERROR
        message:
          type: string
          description: Message lisible par un humain
          example: Les données envoyées sont invalides.
        details:
          type: array
          description: Détail des erreurs de validation, champ par champ
          items:
            $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: name
        message:
          type: string
          example: Le nom est obligatoire.

  responses:
    BadRequest:
      description: Requête invalide (données incorrectes ou identifiant mal formé)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: VALIDATION_ERROR
            message: Les données envoyées sont invalides.
            details:
              - field: name
                message: Le nom est obligatoire.

    Unauthorized:
      description: Authentification absente, invalide ou expirée
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: UNAUTHORIZED
            message: Authentification requise.

    NotFound:
      description: Ressource introuvable ou n'appartenant pas à l'utilisateur connecté
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: NOT_FOUND
            message: Ressource introuvable.

    Conflict:
      description: Conflit avec une ressource existante (email déjà utilisé)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: EMAIL_ALREADY_USED
            message: Cette adresse email est déjà utilisée.

    InternalError:
      description: Erreur interne du serveur
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: INTERNAL_ERROR
            message: Une erreur interne est survenue.